<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>通讯录</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="navbar-inner">
      <div class="navbar-logo"><span class="logo-icon">📇</span><span>通讯录</span></div>
    </div>
  </header>

  <main class="container">
    <section class="toolbar">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜索姓名 / 电话…" autocomplete="off">
      </div>
      <div class="tabs">
        <button class="tab active" id="filterAll">全部</button>
        <button class="tab" id="filterBookmark">⭐ 收藏</button>
      </div>
      <span class="count" id="countText"></span>
      <button class="btn btn-primary" id="addBtn">＋ 新增联系人</button>
    </section>

    <section class="contact-list" id="contactList"></section>
  </main>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <div class="modal-head">
        <h2 id="modalTitle">新增联系人</h2>
        <button type="button" class="modal-close" id="modalCloseBtn">✕</button>
      </div>
      <form id="contactForm" novalidate>
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="nameInput">姓名 <span class="req">*</span></label>
            <input class="form-input" id="nameInput" placeholder="请输入联系人姓名" autocomplete="off">
          </div>
          <div class="form-group">
            <label class="form-label" for="phoneInput">电话</label>
            <input class="form-input" id="phoneInput" placeholder="请输入电话号码">
          </div>
        </div>
        <div class="modal-foot">
          <button type="button" class="btn btn-outline" id="cancelBtn">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/bookmark.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
